{{- /* chezmoi:modify-template */ -}}
{{- /* Cargo's default cargo:token provider reads these registry tokens. */ -}}
{{- $config := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $config = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $token := printf "Bearer %s" (dig "giteaToken" "" .secrets) -}}
{{- range .giteaPackageOwners -}}
{{-   $config = setValueAtPath (list "registries" (printf "gitea-%s" .) "token") $token $config -}}
{{- end -}}
{{ $config | toToml }}
