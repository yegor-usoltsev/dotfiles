{{- /* Upsert the managed login; tea ignores ~/.tea/tea.yml once this file exists. */ -}}
{{- $config := dict -}}
{{- $legacy := joinPath .chezmoi.homeDir ".tea/tea.yml" -}}
{{- if .chezmoi.stdin -}}
{{-   $config = fromYaml .chezmoi.stdin -}}
{{- else if stat $legacy -}}
{{-   $config = include $legacy | fromYaml -}}
{{- end -}}
{{- $logins := list -}}
{{- range dig "logins" (list) $config -}}
{{-   if ne .name "default" -}}
{{-     $logins = append $logins (setValueAtPath "default" false .) -}}
{{-   end -}}
{{- end -}}
{{- $login := dict "name" "default" "url" "https://gitea.usoltsev.xyz"
      "user" "yegor" "token" (dig "giteaToken" "" .secrets) "default" true -}}
{{ $config | setValueAtPath "logins" (append $logins $login) | toYaml }}
