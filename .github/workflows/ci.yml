name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            profile: workstation
          - os: ubuntu-26.04-arm
            profile: devbox
          - os: ubuntu-latest
            profile: server

    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install shellcheck shfmt
          else
            sudo apt-get update
            sudo apt-get install --yes shellcheck shfmt zsh
          fi
          # uv comes from mise, exactly as the bootstrap installs it.
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" use --global --yes uv@latest
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/chezmoi"
          touch "$HOME/.config/chezmoi/secrets.toml"
          chmod 600 "$HOME/.config/chezmoi/secrets.toml"

      - name: Write isolated configs
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/cache" "$RUNNER_TEMP/state"
          for secrets in empty filled; do
            secret=
            if [ "$secrets" = filled ]; then
              secret=placeholder
            fi
            cat > "$RUNNER_TEMP/chezmoi-$secrets.toml" <<EOF
          [hooks.read-source-state.pre]
          command = "$GITHUB_WORKSPACE/home/.chezmoihooks/ensure-prerequisites.sh"

          [data]
          installAppsFromAppStore = false
          profile = "$PROFILE"
          screenshotsPath = "/tmp/Screenshots"

          [data.secrets]
          context7ApiKey = "$secret"
          sshPrivateKey = "$secret"
          sshPublicKey = "$secret"
          githubToken = "$secret"
          giteaToken = "$secret"
          droneToken = "$secret"
          dockerToken = "$secret"
          EOF
          done

      - name: Apply, verify and lint source state
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          # Optional secrets must render empty; the shell checks below use the filled run.
          for secrets in empty filled; do
            test_home="$RUNNER_TEMP/home-$secrets"
            cm=(
              chezmoi
              --source "$GITHUB_WORKSPACE"
              --destination "$test_home"
              --cache "$RUNNER_TEMP/cache"
              --config "$RUNNER_TEMP/chezmoi-$secrets.toml"
              --persistent-state "$RUNNER_TEMP/state/$secrets.boltdb"
              --no-tty --force
            )
            mkdir -p "$test_home"
            "${cm[@]}" apply --exclude=scripts,externals
            "${cm[@]}" verify --exclude=scripts,externals

            if [ "$PROFILE" = server ]; then
              for target in .ssh/id_ed25519 .ssh/id_ed25519.pub .claude .codex .agents .agent-browser/config.json .local/bin/update-browser .paseo .config/mise/github_tokens.toml .config/gh/hosts.yml .config/tea/config.yml .config/shell/credentials.sh .cargo .m2 .gradle; do
                test ! -e "$test_home/$target"
              done
            fi
            credentials=(.config/git/github.credentials .config/git/gitea.credentials .npmrc .netrc)
            if [ "$PROFILE" != server ]; then
              credentials+=(.config/mise/github_tokens.toml .cargo/credentials.toml .m2/settings.xml .gradle/gradle.properties)
            fi
            for target in "${credentials[@]}"; do
              if [ "$secrets" = filled ]; then
                test -f "$test_home/$target"
              else
                test ! -e "$test_home/$target"
              fi
            done
          done

          rendered_dir="$RUNNER_TEMP/rendered-shell"
          python_dir="$RUNNER_TEMP/rendered-python"
          mkdir -p "$rendered_dir" "$python_dir"
          while IFS= read -r script; do
            # The modify_ scripts are Python; apply and verify above already ran them.
            case "$script" in
              home/*modify_*|home/.chezmoitemplates/*.py)
                rendered="$python_dir/${script//\//-}.py"
                case "$script" in
                  *.tmpl|*.py) "${cm[@]}" execute-template < "$script" > "$rendered" ;;
                  *) cp "$script" "$rendered" ;;
                esac
                chmod +x "$rendered"
                continue
                ;;
            esac
            case "$script" in
              .bootstrap.sh|home/.chezmoiscripts/*|home/.chezmoihooks/*.sh|home/dot_local/bin/executable_*|home/dot_claude/*.sh|home/dot_bash*|home/dot_z*|home/dot_config/shell/*) ;;
              *) continue ;;
            esac
            rendered="$rendered_dir/${script//\//-}"
            case "$script" in
              *.tmpl) "${cm[@]}" execute-template < "$script" > "$rendered" ;;
              *) cp "$script" "$rendered" ;;
            esac
            case "$script" in
              home/dot_z*) zsh -n "$rendered"; continue ;;
            esac
            bash -n "$rendered"
            # Shared shell files source optional, machine-local configuration.
            shellcheck -s bash -e SC1090,SC1091 "$rendered"

            # Normalize template whitespace before checking shell formatting.
            sed -e 's/[[:space:]]*$//' "$rendered" | cat -s > "$rendered.normalized"
            printf '%s\n' "$(cat "$rendered.normalized")" > "$rendered.normalized"
            shfmt -d -i 0 "$rendered.normalized"
          done < <(git ls-files --cached --others --exclude-standard)
          # No format check: template data renders as compact JSON.
          uvx ruff check --isolated "$python_dir"
